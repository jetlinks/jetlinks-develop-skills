interface:
  display_name: "Task Continuity"
  short_description: "用状态门禁、复合指纹和少量锚点恢复长任务"
  default_prompt: "使用 $task-continuity 将恢复主视图压缩为 Contract、Checkpoint、DecisionState、Resume，把源码指纹和规则账本留在机器元数据；恢复时先走 continuation fast path，可用时通过宿主无关校验器比较三视图与轻量 revisions，匹配后立即执行 first_allowed_action，失配时只对账失配项，并复用仍有效的验证证据。"
